Please note that using AutoRetainer for RMT purposes is strictly prohibited. ==請注意,嚴禁將 AutoRetainer 用於 RMT(現金交易)用途。
To avoid unnecessary consequences please follow these rules when using AutoRetainer:==為避免不必要的後果,使用 AutoRetainer 時請遵守以下規則:
1. Do not acknowledge your use of AutoRetainer in game chat;==1. 不要在遊戲聊天中承認你使用 AutoRetainer;
2. Do not leave AutoRetainer unattended for prolonged period of time;==2. 不要長時間放置 AutoRetainer 無人看管;
3. Ensure that your total playing+AutoRetainer usage time does not exceeds 16 hours per day; ensure that periods of inactivity exist between your retainer/submersible checking routine;==3. 確保你的遊戲時間加上 AutoRetainer 使用時間每天不超過 16 小時;確保雇員/潛水艇例行檢查之間有閒置時段;
4. Never reply back to players that are trying to do so-called bot checks by trading or chatting with you; instead, blacklist these players immediately;==4. 絕不回應試圖透過交易或聊天對你進行「機器人測試」的玩家;請立即將這些玩家加入黑名單;
5. If questioned by game master, always claim that you are doing all actions manually and never admit plugin usage.==5. 若被 GM 質詢,一律聲稱所有操作皆為手動,絕不承認使用插件。
Failure to follow these guidelines may put your account at risk.==不遵守這些準則可能使你的帳號面臨風險。
